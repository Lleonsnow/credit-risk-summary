services:
  db:
    image: postgres:16-alpine
    container_name: credit-risk-db
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: risk
    ports:
      - "5433:5432"
    volumes:
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk"]
      interval: 2s
      timeout: 3s
      retries: 30
